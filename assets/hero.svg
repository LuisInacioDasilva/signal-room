<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d"><title id="t">Signal Room</title><desc id="d">Banner animado de observabilidade com fluxo de eventos e pulsos.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e1a"/><stop offset="1" stop-color="#10362f"/></linearGradient><pattern id="g" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#5ae4c4" stroke-opacity=".09"/></pattern><style>.ey{font:700 12px monospace;letter-spacing:4px;fill:#57f0cf}.title{font:800 72px Arial,sans-serif;letter-spacing:-5px;fill:#ecf8f2}.sub{font:400 18px Arial,sans-serif;fill:#9ab8b2}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.pulse{animation:pulse 2.3s ease-in-out infinite}.rotate{transform-origin:1010px 136px;animation:turn 8s linear infinite}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes pulse{50%{opacity:.28}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="270" rx="18" fill="url(#bg)"/><rect width="1200" height="270" rx="18" fill="url(#g)"/><text x="68" y="72" class="ey">EVENTS / INCIDENTS / LIVE OPERATIONS</text><text x="68" y="158" class="title">SIGNAL ROOM<tspan fill="#57f0cf">.</tspan></text><text x="69" y="209" class="sub">Do evento à decisão, sem perder o histórico.</text><path d="M650 130H846" class="flow" stroke="#57f0cf" stroke-width="3"/><circle cx="1010" cy="136" r="95" fill="none" stroke="#57f0cf" stroke-opacity=".3"/><circle cx="1010" cy="136" r="65" fill="none" stroke="#57f0cf" stroke-opacity=".5" stroke-dasharray="4 8"/><path class="rotate" d="M1010 136V42" stroke="#57f0cf" stroke-opacity=".6" stroke-width="2"/><circle class="pulse" cx="1010" cy="136" r="30" fill="#57f0cf" fill-opacity=".15" stroke="#57f0cf"/><circle cx="1010" cy="136" r="6" fill="#57f0cf"/><circle class="pulse" cx="945" cy="87" r="7" fill="#ff7777"/></svg>
